<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem SDM PKH Tapin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Kunci Blueprint: Fit to screen & kunci scrolling luar */
    body { overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Panel yang lebih tegas dan jelas */
    .solid-panel { 
      background: #ffffff; 
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }
    .input-field {
      background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px;
      transition: all 0.2s ease;
    }
    .input-field:focus { background: #fff; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
  </style>
</head>
<body class="h-screen w-full bg-slate-50 text-slate-800 flex flex-col overflow-hidden font-sans">

  <!-- Header -->
  <header class="pt-10 pb-6 px-6 bg-white z-10 shrink-0 rounded-b-[2rem] shadow-sm border-b border-slate-100">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">SDM<span class="text-indigo-600">PKH</span> Tapin</h1>
        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-widest mt-1">Sistem Laporan & Analitik</p>
      </div>
      <div class="w-12 h-12 rounded-xl bg-indigo-50 flex items-center justify-center border border-indigo-100 shadow-sm">
        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 overflow-y-auto p-5 pb-32 hide-scroll relative" id="main-content">
    
    <!-- DASHBOARD & ANALISIS -->
    <div id="view-dashboard" class="space-y-6 transition-all duration-300">
      
      <!-- Statistik Eksekutif -->
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-gradient-to-br from-indigo-600 to-blue-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
          <svg class="absolute -right-4 -bottom-4 w-24 h-24 text-white opacity-10" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
          <p class="text-4xl font-black mb-1" id="stat-total">0</p>
          <p class="text-xs font-bold text-indigo-100 uppercase tracking-wide">Total Laporan</p>
        </div>
        <div class="bg-gradient-to-br from-purple-600 to-fuchsia-600 rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
          <svg class="absolute -right-4 -bottom-4 w-24 h-24 text-white opacity-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path></svg>
          <p class="text-4xl font-black mb-1" id="stat-kec">0</p>
          <p class="text-xs font-bold text-purple-100 uppercase tracking-wide">Kecamatan Aktif</p>
        </div>
      </div>

      <!-- Fitur Export Advanced -->
      <div class="solid-panel p-5">
        <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wider mb-4 border-b pb-2">Export Data Rekap</h3>
        <div class="space-y-3">
          <div class="flex gap-2">
            <select id="exportMode" onchange="toggleExportInput()" class="flex-1 px-3 py-2.5 input-field text-sm font-bold text-slate-700">
              <option value="kabupaten">Semua (Se-Kabupaten)</option>
              <option value="kecamatan">Per Kecamatan</option>
              <option value="pdp">Per Nama PDP</option>
            </select>
            <button onclick="exportData()" class="bg-indigo-600 text-white px-4 rounded-xl font-bold text-sm shadow-md flex items-center gap-2 active:scale-95 transition-transform">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> CSV
            </button>
          </div>
          <input type="text" id="exportKeyword" placeholder="Ketikan filter (Opsional)..." class="hidden w-full px-4 py-2.5 input-field text-sm font-medium" />
        </div>
      </div>

      <!-- Analisa Area -->
      <div class="solid-panel p-5">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wider">Monitor Cepat</h3>
          <span id="sync-status" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">Menyinkronkan...</span>
        </div>
        <div id="dashboard-list" class="space-y-3">
           <div class="animate-pulse flex space-x-4 p-3 bg-slate-50 rounded-xl">
             <div class="flex-1 space-y-4 py-1">
               <div class="h-2 bg-slate-200 rounded w-3/4"></div>
               <div class="h-2 bg-slate-200 rounded w-1/2"></div>
             </div>
           </div>
        </div>
      </div>
    </div>

    <!-- INPUT FORM -->
    <div id="view-input" class="hidden solid-panel p-6">
      <h2 class="text-xl font-black text-slate-800 mb-1">Entri Data</h2>
      <p class="text-xs text-slate-500 font-medium mb-6">Database akan tersinkronisasi tanpa loading.</p>
      
      <form id="form-input" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="text-[11px] font-bold text-slate-500 uppercase ml-1 block mb-1">Target Penyimpanan</label>
          <select id="sheetName" required class="w-full px-4 py-3.5 input-field text-sm font-bold text-slate-700">
            <option value="Sheet1">Sheet 1 - Daftar Hadir</option>
            <option value="Sheet2">Sheet 2 - Laporan SKP</option>
          </select>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-500 uppercase ml-1 block mb-1">Data Petugas</label>
          <input type="text" id="namaPdp" required placeholder="Nama Lengkap PDP" class="w-full px-4 py-3.5 input-field text-sm font-medium mb-3 uppercase" />
          <div class="grid grid-cols-2 gap-3">
            <input type="text" id="kecamatan" required placeholder="Kecamatan" class="px-4 py-3.5 input-field text-sm font-medium uppercase" />
            <input type="text" id="desa" required placeholder="Desa" class="px-4 py-3.5 input-field text-sm font-medium uppercase" />
          </div>
        </div>

        <div>
          <label class="text-[11px] font-bold text-slate-500 uppercase ml-1 block mb-1">Keterangan Laporan</label>
          <select id="dataBulan" required class="w-full px-4 py-3.5 input-field text-sm font-bold text-slate-700 mb-3">
            <option value="">Pilih Bulan Laporan...</option>
            <option value="JANUARI">Januari</option>
            <option value="FEBRUARI">Februari</option>
            <option value="MARET">Maret</option>
            <option value="APRIL">April</option>
            <option value="MEI">Mei</option>
          </select>
          <input type="url" id="linkBukti" placeholder="Link G-Drive (Opsional)" class="w-full px-4 py-3.5 input-field text-sm font-medium" />
        </div>
        
        <button type="submit" class="w-full py-4 mt-2 bg-slate-900 text-white font-black rounded-xl shadow-lg hover:bg-indigo-600 active:scale-95 transition-all flex justify-center items-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          Simpan Instan
        </button>
      </form>
    </div>

    <!-- AGENDA -->
    <div id="view-agenda" class="hidden">
      <h2 class="text-xl font-black text-slate-800 mb-5 px-1 uppercase tracking-tight">Agenda Terakhir</h2>
      <div id="agenda-list" class="space-y-4"></div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="absolute bottom-6 left-6 right-6 bg-slate-900 rounded-3xl px-6 py-4 flex justify-between items-center z-20 shadow-2xl border border-slate-700">
    <button onclick="switchTab('dashboard')" class="flex flex-col items-center gap-1 transition-colors text-white w-16" id="nav-dashboard">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
      <span class="text-[10px] font-bold uppercase tracking-wider">Analisa</span>
    </button>
    
    <button onclick="switchTab('input')" class="-mt-12 bg-indigo-600 p-4 rounded-full text-white shadow-[0_10px_20px_rgba(79,70,229,0.4)] active:scale-90 transition-transform border-[6px] border-slate-50">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
    </button>
    
    <button onclick="switchTab('agenda')" class="flex flex-col items-center gap-1 transition-colors text-slate-500 w-16" id="nav-agenda">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      <span class="text-[10px] font-bold uppercase tracking-wider">Agenda</span>
    </button>
  </nav>

  <script>
    // MASUKKAN URL BARU DI SINI (Pastikan akses "Anyone")
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzf3_9B1RA0nk5aCjETYpLHw9xZWcoiwwUoebIPrSDiSHjdnB4fMcfLB6HmDpklHzBeOA/exec';
    let appData = [];

    async function initData() {
      const statusEl = document.getElementById('sync-status');
      try {
        const response = await fetch(GAS_URL);
        const result = await response.json();
        
        if(result.status === 'success') {
          appData = result.data.reverse(); 
          statusEl.innerText = 'Tersinkronisasi';
          statusEl.classList.replace('bg-slate-100', 'bg-emerald-100');
          statusEl.classList.replace('text-slate-400', 'text-emerald-600');
          updateStats();
          renderDashboardList();
          renderAgendaList();
        }
      } catch (error) {
        statusEl.innerText = 'Akses Ditolak';
        statusEl.classList.replace('bg-slate-100', 'bg-red-100');
        statusEl.classList.replace('text-slate-400', 'text-red-600');
        document.getElementById('dashboard-list').innerHTML = `
          <div class="p-4 bg-red-50 rounded-xl border border-red-100 text-center">
            <p class="text-sm font-bold text-red-600">Database Gagal Diakses</p>
            <p class="text-[10px] text-red-400 mt-1">Deploy ulang GAS Anda dan atur akses menjadi "Siapa Saja" (Anyone).</p>
          </div>`;
      }
    }

    function toggleExportInput() {
      const mode = document.getElementById('exportMode').value;
      const input = document.getElementById('exportKeyword');
      if(mode === 'kabupaten') {
        input.classList.add('hidden');
      } else {
        input.classList.remove('hidden');
        input.placeholder = mode === 'kecamatan' ? "Ketik nama Kecamatan..." : "Ketik nama PDP...";
      }
    }

    function exportData() {
      if(appData.length === 0) return alert("Data kosong atau belum memuat.");
      
      const mode = document.getElementById('exportMode').value;
      const keyword = document.getElementById('exportKeyword').value.toLowerCase();
      let filtered = appData;

      if (mode === 'kecamatan' && keyword) {
        filtered = appData.filter(d => d.kecamatan.toLowerCase().includes(keyword));
      } else if (mode === 'pdp' && keyword) {
        filtered = appData.filter(d => d.namaPdp.toLowerCase().includes(keyword));
      }

      if (filtered.length === 0) return alert("Data dengan filter tersebut tidak ditemukan.");

      let csv = "Nama PDP,Desa,Kecamatan,Bulan,Link Bukti\n";
      filtered.forEach(row => { csv += `"${row.namaPdp}","${row.desa}","${row.kecamatan}","${row.bulan}","${row.link}"\n`; });
      
      const uri = encodeURI("data:text/csv;charset=utf-8," + csv);
      const link = document.createElement("a");
      link.setAttribute("href", uri);
      link.setAttribute("download", `Rekap_${mode.toUpperCase()}_SDM.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const payload = {
        sheetName: document.getElementById('sheetName').value,
        namaPdp: document.getElementById('namaPdp').value.toUpperCase(),
        kecamatan: document.getElementById('kecamatan').value.toUpperCase(),
        desa: document.getElementById('desa').value.toUpperCase(),
        dataBulan: document.getElementById('dataBulan').value,
        linkBukti: document.getElementById('linkBukti').value
      };

      // Optimistic UI Update
      appData.unshift({ ...payload, bulan: payload.dataBulan, link: payload.linkBukti }); 
      updateStats(); renderDashboardList(); renderAgendaList();

      document.getElementById('namaPdp').value = '';
      document.getElementById('desa').value = '';
      document.getElementById('linkBukti').value = '';

      switchTab('agenda');
      
      fetch(GAS_URL, { 
        method: 'POST', 
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload) 
      }).catch(err => console.log(err));
    }

    function switchTab(tabId) {
      ['dashboard', 'input', 'agenda'].forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
      document.getElementById(`view-${tabId}`).classList.remove('hidden');

      document.getElementById('nav-dashboard').classList.replace('text-white', 'text-slate-500');
      document.getElementById('nav-agenda').classList.replace('text-white', 'text-slate-500');
      
      if(tabId === 'dashboard') document.getElementById('nav-dashboard').classList.replace('text-slate-500', 'text-white');
      if(tabId === 'agenda') document.getElementById('nav-agenda').classList.replace('text-slate-500', 'text-white');
    }

    function updateStats() {
      document.getElementById('stat-total').innerText = appData.length;
      document.getElementById('stat-kec').innerText = new Set(appData.map(item => item.kecamatan.toUpperCase())).size;
    }

    function renderDashboardList() {
      const container = document.getElementById('dashboard-list');
      if(appData.length === 0) { container.innerHTML = '<p class="text-sm text-slate-400">Data belum ada.</p>'; return; }
      
      container.innerHTML = '';
      appData.slice(0, 5).forEach(item => {
        container.innerHTML += `
          <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100">
            <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center font-bold text-indigo-600">${item.namaPdp.charAt(0)}</div>
            <div class="flex-1">
              <p class="text-sm font-bold text-slate-800">${item.namaPdp}</p>
              <p class="text-[10px] font-semibold text-slate-500">${item.desa} • ${item.kecamatan}</p>
            </div>
            <span class="text-[10px] font-black px-2 py-1 bg-white border border-slate-200 text-slate-600 rounded uppercase shadow-sm">${item.bulan}</span>
          </div>`;
      });
    }

    function renderAgendaList() {
      const container = document.getElementById('agenda-list');
      container.innerHTML = '';
      appData.forEach(item => {
        container.innerHTML += `
          <div class="p-4 bg-white rounded-2xl border border-slate-100 shadow-sm flex flex-col gap-3">
            <div class="flex justify-between items-start">
              <h4 class="font-bold text-slate-800 text-sm">${item.namaPdp}</h4>
              <span class="text-[10px] font-black px-2 py-1 bg-indigo-50 text-indigo-600 rounded uppercase border border-indigo-100">${item.bulan}</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold px-2 py-1 bg-slate-100 text-slate-600 rounded">${item.kecamatan}</span>
              <span class="text-[10px] font-bold px-2 py-1 bg-slate-100 text-slate-600 rounded">${item.desa}</span>
            </div>
          </div>`;
      });
    }

    initData();
  </script>
</body>
</html>
